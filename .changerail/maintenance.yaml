schema: changerail.maintenance-policy.v1
catalog_path: .changerail/knowledge.yaml
generated_index_path: .changerail/KNOWLEDGE.md
scan:
  include_globs:
    - .changerail/KNOWLEDGE.md
    - README.md
    - SECURITY.md
    - AGENTS.shared.md
    - docs/*.md
  exclude_globs: []
  active_scope_globs:
    - README.md
    - SECURITY.md
    - AGENTS.shared.md
    - docs/*.md
  enabled_detectors:
    - catalog-coverage
    - repository-orphans
    - markdown-local-links
    - generated-freshness
    - forbidden-active-references
  fail_on: major
  timeout_seconds: 30
  detectors:
    markdown_local_links:
      extensions:
        - .md
    generated_freshness:
      check_render_index: true
    forbidden_active_references:
      patterns:
        - id: private-home-path
          pattern: /home/
          severity: major
          message: private home path must not appear in active knowledge
        - id: user-home-path
          pattern: /Users/
          severity: major
          message: private user home path must not appear in active knowledge
        - id: secret-assignment
          pattern: token=
          severity: blocker
          message: token-like assignments must not appear in active knowledge
