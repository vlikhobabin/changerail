name: ChangeRail
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: npm --prefix tools/openspec ci --ignore-scripts --no-audit --no-fund
      - run: python -m pytest -q tools/changerail/tests
      - run: node --test tools/openspec/test-wrapper.mjs
      - run: python -m ruff check scripts tools/changerail/tests distribution.py
      - run: python scripts/public-surface-scan.py
      - run: git diff --check
