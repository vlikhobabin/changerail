name: ChangeRail CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ChangeRail release gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: "0"

      - name: Set up Node.js for OpenSpec wrapper
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Prepare offline release dependencies
        run: |
          python3 -m venv .runtime/changerail/ci-venv
          .runtime/changerail/ci-venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          echo "$PWD/.runtime/changerail/ci-venv/bin" >> "$GITHUB_PATH"
          ./bin/openspec --version >/dev/null

      - name: Run canonical full release
        run: python3 scripts/run-release-baseline.py --profile full-release
