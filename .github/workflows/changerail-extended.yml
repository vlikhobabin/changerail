name: ChangeRail Extended Regression

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ChangeRail extended regressions
    runs-on: ubuntu-latest

    steps:
      - name: Check out full repository history
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Node.js for OpenSpec wrapper
        # actions/setup-node v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install Python release dependencies
        run: |
          python3 -m venv .runtime/changerail/ci-venv
          .runtime/changerail/ci-venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          echo "$PWD/.runtime/changerail/ci-venv/bin" >> "$GITHUB_PATH"

      - name: Run exact extended release suite
        run: python3 scripts/run-release-baseline.py --suite extended
