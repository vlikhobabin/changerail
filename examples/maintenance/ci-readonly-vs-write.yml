name: ChangeRail maintenance separated jobs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only maintenance scan
        run: |
          ./bin/changerail-maintenance-runner scan \
            --timeout 900 \
            --run-id "ci-readonly-${{ github.run_id }}" \
            --json

  write-follow-up-placeholder:
    if: false
    needs: readonly-analysis
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: |
          echo "Create a separate explicit write workflow before using API credentials."

# Keep read-only analysis separate from any job that receives write
# permissions, API credentials, comments, pull request creation or publication
# authority.
