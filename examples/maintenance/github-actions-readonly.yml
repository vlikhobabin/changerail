name: ChangeRail maintenance audit

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run read-only maintenance audit
        run: |
          ./bin/changerail-maintenance-runner scan \
            --timeout 900 \
            --run-id "github-${{ github.run_id }}" \
            --json

      - name: Upload maintenance runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changerail-maintenance-${{ github.run_id }}
          path: .runtime/changerail/maintenance/runs/github-${{ github.run_id }}/
          if-no-files-found: warn

# GitHub scheduled workflows run on the default branch and are at-least-once
# best effort. This read-only example does not commit, push, comment or open a
# pull request.
