schema: changerail.maintenance-policy.v1
catalog_path: knowledge.yaml
generated_index_path: KNOWLEDGE.md
scan:
  include_globs:
    - docs/**/*.md
  exclude_globs: []
  enabled_detectors:
    - adapters
  fail_on: major
  timeout_seconds: 1
  adapters:
    - id: valid
      argv:
        - python3
        - adapters/valid.py
    - id: invalid-json
      argv:
        - python3
        - adapters/invalid_json.py
    - id: missing-fields
      argv:
        - python3
        - adapters/missing_fields.py
    - id: unsafe-path
      argv:
        - python3
        - adapters/unsafe_path.py
    - id: nonzero
      argv:
        - python3
        - adapters/nonzero.py
    - id: timeout
      argv:
        - python3
        - adapters/timeout.py
      timeout_seconds: 1
