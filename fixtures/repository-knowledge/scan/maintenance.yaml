schema: changerail.maintenance-policy.v1
catalog_path: knowledge.yaml
generated_index_path: KNOWLEDGE.md
scan:
  include_globs:
    - docs/**/*.md
  exclude_globs: []
  active_scope_globs:
    - docs/**/*.md
  enabled_detectors:
    - catalog-coverage
    - repository-orphans
    - markdown-local-links
    - generated-freshness
    - forbidden-active-references
  fail_on: major
  timeout_seconds: 30
  detectors:
    markdown_local_links:
      extensions:
        - .md
    generated_freshness:
      check_render_index: true
    forbidden_active_references:
      patterns:
        - id: private-path
          pattern: FORBIDDEN-ACTIVE-REFERENCE
          severity: major
          message: forbidden reference fixture
