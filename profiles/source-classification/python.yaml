schema: changerail.source-classification-profile.v1
id: python
version: 1.0.0
description: Generic Python source under src.
classification:
  source_kinds:
    - id: python
      suffixes: [".py"]
      production_roots: ["src"]
      measure: lines
  non_production_roots: ["tests", "fixtures", "examples", "docs", "templates"]
detection:
  signals:
    - id: src-python
      path_glob: "src/**/*.py"
      weight: 70
    - id: pyproject
      path_glob: "pyproject.toml"
      weight: 30
