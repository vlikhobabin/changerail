schema: changerail.source-classification-profile.v1
id: structured-xml
version: 1.0.0
description: Generic structural XML source under src/designer.
classification:
  source_kinds:
    - id: structured-xml
      suffixes: [".xml"]
      production_roots: ["src/designer"]
      measure: xml-structure
  non_production_roots: ["tests", "fixtures", "examples", "docs", "templates", "schemas"]
detection:
  signals:
    - id: designer-xml
      path_glob: "src/designer/**/*.xml"
      weight: 100
