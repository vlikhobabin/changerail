[project]
name = "changerail-native-runtime"
version = "2.0.0rc5"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "uv>=0.6,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts", "scripts.changerail*"]

[tool.pytest.ini_options]
testpaths = ["tools/changerail/tests"]
pythonpath = [".", "tools/changerail/tests"]
# Heavy fixtures copy the pinned toolchain and build engine snapshots per test,
# and /tmp here is a small RAM-backed tmpfs. pytest keeps the last three runs by
# default, which multiplies that footprint and can fill the tmpfs - a full
# copytree then fails with ENOSPC and the run reports a mass of unrelated
# errors. Keep one generation, and only when something failed.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
