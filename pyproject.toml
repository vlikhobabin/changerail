[project]
name = "changerail-native-runtime"
version = "2.0.0rc6"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "uv>=0.6,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts", "scripts.changerail*"]

[tool.pytest.ini_options]
testpaths = ["tools/changerail/tests"]
pythonpath = [".", "tools/changerail/tests"]
# Heavy fixtures copy the pinned toolchain and build engine snapshots per test,
# and /tmp here is a small RAM-backed tmpfs. pytest keeps the last three runs by
# default, which multiplies that footprint. Keep one generation: the retention
# policy stays "all" on purpose, because removing a passing test's tmp_path
# during its own teardown races tests that patch os.scandir for the duration of
# their teardown.
tmp_path_retention_count = 1
tmp_path_retention_policy = "all"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
